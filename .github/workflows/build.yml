name: Build Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show Java version
        run: java -version

      - name: Show gradlew info
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Upload Gradle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: /tmp/gradle_output.txt

      - name: Upload JAR
        if: env.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: dimensionmod-jar
          path: build/libs/dimensionmod-*.jar
